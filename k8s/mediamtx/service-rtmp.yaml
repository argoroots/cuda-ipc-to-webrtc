apiVersion: v1
kind: Service
metadata:
  name: mediamtx-rtmp
  namespace: oden-streaming
  labels:
    app: mediamtx
  annotations:
    # Azure-specific: request a static public IP if needed
    # service.beta.kubernetes.io/azure-load-balancer-resource-group: your-resource-group
    # service.beta.kubernetes.io/azure-load-balancer-ipv4: x.x.x.x
spec:
  type: LoadBalancer
  selector:
    app: mediamtx
  ports:
    - name: rtmp
      port: 1935
      targetPort: rtmp
      protocol: TCP
  # Restrict RTMP ingress to the local PC's public IP
  # loadBalancerSourceRanges:
  #   - "YOUR_LOCAL_PC_PUBLIC_IP/32"
